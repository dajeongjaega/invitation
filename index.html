<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>다정재가복지센터 개소식 초대</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="card">

  <section class="hero">
    <p class="eyebrow">개소식 초대</p>
    <h1>다정재가복지센터</h1>
    <p class="subtitle">작은 정성으로 이웃의 일상을 함께 돌보는 공간,<br>다정재가복지센터가 문을 엽니다.</p>
  </section>

  <section class="dday">
    <p class="section-label">D-DAY</p>
    <div id="countdown" class="countdown">
      <div class="unit"><span id="days">00</span><small>일</small></div>
      <div class="unit"><span id="hours">00</span><small>시간</small></div>
      <div class="unit"><span id="minutes">00</span><small>분</small></div>
      <div class="unit"><span id="seconds">00</span><small>초</small></div>
    </div>
    <p id="ddayMessage" class="dday-message"></p>
  </section>

  <section class="info">
    <div class="info-row">
      <span class="info-icon">📅</span>
      <div>
        <p class="info-title">일시</p>
        <p class="info-text">2026년 12월 24일 (목)</p>
      </div>
    </div>
    <div class="info-row">
      <span class="info-icon">📍</span>
      <div>
        <p class="info-title">장소</p>
        <p class="info-text">다정재가복지센터<br>경상남도 밀양시 밀성로2길 19 (내이동)</p>
      </div>
    </div>
  </section>

  <section class="map-section">
    <p class="section-label">오시는 길</p>
    <div class="map-wrap">
      <iframe
        src="https://maps.google.com/maps?q=경상남도 밀양시 밀성로2길 19 (내이동)&output=embed"
        width="100%" height="260" style="border:0" loading="lazy"
        allowfullscreen referrerpolicy="no-referrer-when-downgrade"
        title="다정재가복지센터 위치 지도"></iframe>
    </div>
    <div class="address-box">
      <p id="addressText">경상남도 밀양시 밀성로2길 19 (내이동)</p>
      <button id="copyBtn" class="copy-btn">주소 복사</button>
    </div>
    <div class="map-links">
      <a class="map-btn" target="_blank" rel="noopener"
         href="https://map.kakao.com/link/search/경상남도 밀양시 밀성로2길 19 (내이동)">카카오맵</a>
      <a class="map-btn" target="_blank" rel="noopener"
         href="https://map.naver.com/v5/search/경상남도 밀양시 밀성로2길 19 (내이동)">네이버지도</a>
      <a class="map-btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&query=경상남도 밀양시 밀성로2길 19 (내이동)">구글지도</a>
    </div>
  </section>

  <footer class="footer">
    <p>귀한 걸음으로 함께해 주시면 큰 힘이 되겠습니다.</p>
    <p class="footer-small">다정재가복지센터 드림</p>
  </footer>

</div>
<script src="js/script.js"></script>
</body>
</html>
